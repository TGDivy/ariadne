[project]
name = "ariadne"
version = "0.1.0"
description = "A persistent personal AI partner."
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "imapclient>=3.0.1",
    "markdown-it-py>=4.2.0",
    "openai-codex>=0.147.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "pypdf>=6.0.0",
    "pyyaml>=6.0.2",
    "python-telegram-bot>=22.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
