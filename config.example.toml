version = 1
human_name = "Your Name"
vault = "~/ariadne-thread"
# Optional: where Codex starts shell and file work. Defaults to `vault`.
# workspace = "~/ariadne-workspace"

[telegram]
bot_token = ""
allowed_user_id = 0
state = "~/.local/state/ariadne/telegram.sqlite3"
# Optional argv-only command. `{input}` is replaced with the private OGG path;
# the command must write only the UTF-8 transcript to stdout.
# voice_transcription_command = ["whisper-transcribe", "{input}"]
# voice_transcription_timeout_seconds = 120

[telegram.identity]
name = "Iris"
description = "Iris runs on your own machine and follows The Thread wherever it leads — a private chat, an open-ended mission, no fixed destination."
short_description = "Somewhere between a rainbow and a labyrinth."
# profile_photo = "~/.config/ariadne/iris.jpg"

[icloud]
# username = "YOUR_ICLOUD_ADDRESS"
# app_password = ""
# mail_label = "iCloud"

# One personal Outlook.com account can run alongside iCloud Mail. Register a
# Microsoft public client first, then run `ariadne mail authorize-outlook`.
[outlook]
enabled = false
# address = "YOUR_OUTLOOK_ADDRESS"
# client_id = "YOUR_MICROSOFT_PUBLIC_CLIENT_ID"
token_cache = "~/.local/state/ariadne/outlook-token.json"
label = "Outlook"

[mail]
enabled = false
state = "~/.local/state/ariadne/mail.sqlite3"
# routes = "~/.config/ariadne/mail-routes.yaml"

[calendar]
enabled = false
timezone = "UTC"
# default_calendar = "Calendar"

[health]
enabled = false
timezone = "UTC"
timeout_seconds = 30
# api_url = "https://your-ithaca-host.example"
# read_token = ""

[browser]
enabled = false
state = "~/.local/state/ariadne/browser/browser.sqlite3"
profiles = "~/.local/share/ariadne/browser/profiles"
artifacts = "~/.local/state/ariadne/browser/artifacts"
socket = "~/.local/state/ariadne/browser/browser.sock"
# Headful is required for normal home-server operation and human takeover.
headless = false
# takeover_url = "https://your-private-browser-view.example"
lease_seconds = 900
action_timeout_seconds = 30
observation_max_chars = 12000
observation_max_elements = 120
journal_retention_days = 14
journal_max_entries = 5000

[grocery]
# Requires [browser].enabled. Real checkout stays off until the documented
# owner-observed dry runs on the home server pass.
enabled = false
state = "~/.local/state/ariadne/grocery.sqlite3"
browser_profile = "personal"
base_url = "https://www.waitrose.com"
checkout_enabled = false
# Pounds of drift permitted on weighted items before approval is invalidated.
weighted_tolerance = "1.00"
approval_ttl_seconds = 900

[revisits]
state = "~/.local/state/ariadne/revisits.sqlite3"
poll_interval_seconds = 15

[stewardship]
enabled = false
timezone = "UTC"
waking_start = "09:00"
waking_end = "21:00"
state = "~/.local/state/ariadne/stewardship.sqlite3"
poll_interval_seconds = 60

[telemetry]
enabled = false
service_name = "ariadne"
metrics = true
traces = true
export_interval_seconds = 60
# endpoint = "https://otlp-gateway-REGION.grafana.net/otlp"
# authorization = "Basic YOUR_TOKEN"

# Profile overrides are optional. Omitted values come from src/ariadne/profile.py.
# [profiles.telegram]
# model = "gpt-5.6-luna"
# effort = "high"
# web_search = "disabled"

# [profiles.mail]
# model = "gpt-5.6-terra"
# effort = "medium"
# web_search = "live"

# [profiles.stewardship]
# model = "gpt-5.6-terra"
# effort = "high"
# web_search = "live"

# Revisit profiles map the semantic attention chosen by Iris to runtime cost.
# [profiles.revisit-light]   # Luna low
# [profiles.revisit-focused] # Luna high
# [profiles.revisit-deep]    # Terra medium
